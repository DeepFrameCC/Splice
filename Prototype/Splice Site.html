<!doctype html>
<html lang="fr" data-screen-label="Splice Site">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Splice — Boîte de production audiovisuelle</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="styles.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="site.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel">
  // Sync dark mode flag onto the site root for CSS targeting
  function Boot() {
    React.useEffect(() => {
      const obs = new MutationObserver(() => {});
      return () => obs.disconnect();
    }, []);
    return <App />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Boot />);
</script>

<script type="text/babel">
  // Reflect t.dark on body via a side-effect in App: simpler — observe CSS var.
  // (We set data-dark on body whenever .df-site var --df-bg matches the dark color.)
  setInterval(() => {
    const site = document.querySelector('.df-site > div, .df-root');
    if (!site) return;
    const bg = getComputedStyle(site.parentElement).getPropertyValue('--df-bg').trim();
    document.body.dataset.dark = (bg === '#0A0A23') ? 'true' : 'false';
  }, 250);
</script>
</body>
</html>
